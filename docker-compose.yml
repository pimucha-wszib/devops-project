version: "3.9"

services:

  db:
    image: postgres:18
    container_name: postgres_db
    restart: always
    networks:
      - back_net
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      target: final
    container_name: flask_app
    depends_on:
      db:
        condition: service_healthy
      seed_runner:
        condition: service_completed_successfully
    networks:
      - back_net
      - front_net
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/app_db"
    expose:
      - "5000"

  seed_runner:
    build:
      context: .
      target: final
    container_name: seed_runner
    command: ["python", "-m", "seed.run_seed"]
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/app_db"
      OUTPUT_DIR: "/seed_output"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back_net
    volumes:
      - seed_output:/seed_output
    restart: "no"

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - front_net

networks:
  back_net:
  front_net:

volumes:
  db_data:
  seed_output:
  nginx_logs:
